name: BarbudoCore

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test --parallel

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --parallel
